<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            background: white;
            padding: 40px 20px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            color: #4f46e5;
        }

        p {
            color: #444444;
            font-size: 18px;
        }

        button {
            background-color: #4f46e5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #3730a3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>This is my first website created using HTML, CSS, and JavaScript.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Congratulations! Your website is working!";
        }
    </script>
</body>
</html>
